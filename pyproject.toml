[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenthood"
version = "0.2.12"
description = "Robinhood trading agent powered by agentu + Robinhood MCP"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "agentu>=2.4.0",
    "rich>=13.0",
]

[project.scripts]
agenthood = "agenthood.cli:cli"

[tool.hatch.build.targets.sdist]
include = ["src/", "skills/", "README.md", "AGENTS.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/agenthood"]
